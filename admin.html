<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无类CSS示例页面</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>欢迎来到无类CSS示例页面</h1>
        <p>这是一个展示无类CSS样式的示例页面，适应不同设备和屏幕尺寸。</p>
    </header>

    <nav>
        <a href="#">部分一</a>
        <a href="#">部分二</a>
        <a href="#">部分三</a>
        <a href="#">部分一</a>
        <a href="#">部分二</a>
        <a href="#">部分三</a>
    </nav>

    <main>
        <section>
            <h2>部分一：段落与标题</h2>
            <p>这是一个普通的段落文本，段落之间有合适的间距，阅读体验良好。</p>
            <blockquote>
                这是一个引用块，可以用来引用其他来源的文字。
            </blockquote>
            <hr>
        </section>

        <section>
            <h2>部分二：表格与列表</h2>

            <h3>表格示例</h3>
            <table>
                <caption>示例表格</caption>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>年龄</th>
                        <th>职业</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>张三</td>
                        <td>28</td>
                        <td>工程师</td>
                    </tr>
                    <tr>
                        <td>李四</td>
                        <td>34</td>
                        <td>设计师</td>
                    </tr>
                </tbody>
            </table>

            <h3>有序列表</h3>
            <ol>
                <li>第一项</li>
                <li>第二项</li>
                <li>第三项</li>
            </ol>

            <h3>无序列表</h3>
            <ul>
                <li>项目一</li>
                <li>项目二</li>
                <li>项目三</li>
            </ul>

            <hr>
        </section>

        <section>
            <h2>部分三：表单与按钮</h2>
            <form action="#">
                <label>姓名:</label>
                <input type="text" name="name">

                <label>邮箱:</label>
                <input type="email" name="email">

                <label>留言:</label>
                <textarea name="message"></textarea>

                <button type="submit">提交</button>
            </form>

            <hr>
        </section>
    </main>

    <footer>
        <p>这是页面的页脚部分。</p>
    </footer>
    <nav>
        <a href="#">&laquo; 上一页</a>
        <a>1</a>
        <a>2</a>
        <a>3</a>
        <a href="#">&raquo; 下一页</a>
    </nav>
    

</body>
</html>
