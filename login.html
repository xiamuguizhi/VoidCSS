<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidCSS 示例</title>
    <link rel="stylesheet" href="style.css"> <!-- 引入VoidCSS -->
</head>
<body>

<header>
    <h1>欢迎来到 VoidCSS 示例</h1>
</header>

<nav>
    <a href="#">首页</a>
    <a href="#">关于我们</a>
    <a href="#">联系</a>
</nav>

<section>
    <h2>关于 VoidCSS</h2>
    <p>这是一个简单的无类 CSS 框架，旨在提供一个简洁的设计基础。</p>
    <p>你可以使用以下链接来获取更多信息：</p>
    <ul>
        <li><a href="#">文档</a></li>
        <li><a href="#">示例</a></li>
        <li><a href="#">支持</a></li>
    </ul>
</section>

<section>
    <h2>联系我们</h2>
    <form>
        <label for="name">姓名：</label>
        <input type="text" id="name" placeholder="请输入你的姓名" required>

        <label for="email">邮箱：</label>
        <input type="email" id="email" placeholder="请输入你的邮箱" required>

        <label for="message">留言：</label>
        <textarea id="message" rows="4" placeholder="你的留言..." required></textarea>

        <button type="submit">发送</button>
    </form>
</section>

<footer>
    <p>版权 &copy; 2024 VoidCSS 示例</p>
</footer>

</body>
</html>
